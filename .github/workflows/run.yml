name: Job scraper

on:
  schedule:
    - cron: "0 6,16 * * *"     # 08:00 and 18:00 Warsaw summer time (UTC+2); use "0 7,17 * * *" after 25 Oct (UTC+1)
  workflow_dispatch:

permissions:
  contents: write              # commits the 7-day CSV to main and the database to the `data` branch

concurrency:
  group: job-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore de-duplication database
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git show origin/data:local_jobs.db > local_jobs.db
            echo "Restored database ($(du -h local_jobs.db | cut -f1))."
          else
            echo "No data branch yet; starting with an empty database."
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          MAX_RUNTIME_MIN: "25"
          RESULTS_WANTED: "25"
          HOURS_OLD: "36"
          CSV_RETENTION_DAYS: "7"
        run: python scraper.py

      - name: Publish run summary
        if: always()
        run: |
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist de-duplication database
        if: always()
        run: |
          if [ ! -f local_jobs.db ]; then
            echo "No database to persist."
            exit 0
          fi
          rm -rf "$RUNNER_TEMP/job-data"
          git init -q -b data "$RUNNER_TEMP/job-data"
          cp local_jobs.db "$RUNNER_TEMP/job-data/"
          cd "$RUNNER_TEMP/job-data"
          git add local_jobs.db
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "data $(date -u +'%Y-%m-%d %H:%M')"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Save recent jobs
        run: |
          git config user.name  "job-scraper"
          git config user.email "job-scraper@users.noreply.github.com"
          git add jobs.csv
          if git diff --staged --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update recent jobs $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-scraper-report
          path: reports/latest.md
          if-no-files-found: ignore
