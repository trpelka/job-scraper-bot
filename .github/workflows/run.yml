name: Job scraper

on:
  schedule:
    - cron: "0 6,16 * * *"     # 08:00 and 18:00 Warsaw summer time (UTC+2); use "0 7,17 * * *" after 25 Oct (UTC+1)
  workflow_dispatch:

permissions:
  contents: write              # lets the job commit jobs.csv / local_jobs.db back to the repo

concurrency:
  group: job-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          MAX_RUNTIME_MIN: "25"
          RESULTS_WANTED: "25"
          HOURS_OLD: "36"
        run: python scraper.py

      - name: Publish run summary
        if: always()
        run: |
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save results (keeps the de-duplication DB between runs)
        run: |
          git config user.name  "job-scraper"
          git config user.email "job-scraper@users.noreply.github.com"
          git add jobs.csv local_jobs.db
          if git diff --staged --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update jobs $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-scraper-report
          path: reports/latest.md
          if-no-files-found: ignore
