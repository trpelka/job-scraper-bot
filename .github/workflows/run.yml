name: Job scraper

on:
  schedule:
    - cron: "0 6,16 * * *"     # 08:00 and 18:00 Warsaw summer time (UTC+2); use "0 7,17 * * *" after 25 Oct (UTC+1)
  workflow_dispatch:

permissions:
  contents: write              # lets the job commit jobs.csv / local_jobs.db back to the repo

concurrency:
  group: job-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -U python-jobspy pandas requests beautifulsoup4
      - name: Run scraper
        run: python scraper.py
      - name: Save results (keeps the de-duplication DB between runs)
        run: |
          git config user.name  "job-scraper"
          git config user.email "job-scraper@users.noreply.github.com"
          git add jobs.csv local_jobs.db
          git diff --staged --quiet || git commit -m "Update jobs $(date -u +'%Y-%m-%d %H:%M')"
          git push
